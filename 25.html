<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konfekšu lietus</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #dba3c9; color: #b820a3; }
button { background-color: #ebc3da; color: rgb(122, 31, 92); border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Konfekšu lietus</h1>
<p>Meiģini noķert saldumus novietojot apēlētāju pie saldumu krišanas vietas, lai iegūtu punktus. Kustini spēlētāju un ēģini noķert maksimāli daudz punktu</p>
<img src="atteli/varonis.png" alt="brūns konfekšu grozs" width="128">
<p>Uzvaras skaņa:</p>
<audio controls src="skanas/Winning_Sound_Effect.wav"></audio>
<p id="punkti">Punkti: 0</p>
<button onclick="savakt()">Noķert konfekti</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
